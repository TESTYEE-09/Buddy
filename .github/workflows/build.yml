name: Build LethalAICrewmate

on:
  push:
    branches:
      - main
      - 'ship/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lethal-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate source and release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'ThunderstorePackage/manifest.json' -Raw | ConvertFrom-Json
          $manifestVersion = [string]$manifest.version_number

          if ([string]$manifest.name -ne 'LethalAICrewmate') { throw 'Unexpected manifest name' }
          if ($manifestVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Manifest version is not x.y.z: $manifestVersion" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.description)) { throw 'Manifest description is empty' }
          if ([string]$manifest.website_url -notmatch '^https://') { throw 'Manifest website_url must use HTTPS' }
          if (@($manifest.dependencies) -notcontains 'BepInEx-BepInExPack-5.4.2100') { throw 'Required BepInEx dependency missing from manifest' }

          [xml]$project = Get-Content 'src/LethalAICrewmate.csproj' -Raw
          $projectVersion = [string]($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version

          $plugin = Get-Content 'src/Plugin.cs' -Raw
          if ($plugin -notmatch 'ModVersion\s*=\s*"([^"]+)"') { throw 'Could not read Plugin.ModVersion' }
          $pluginVersion = $Matches[1]

          if ($manifestVersion -ne $projectVersion -or $manifestVersion -ne $pluginVersion) {
            throw "Version mismatch: manifest=$manifestVersion csproj=$projectVersion plugin=$pluginVersion"
          }

          $trackedBinaries = @(git ls-files 'LethalAICrewmate-*.zip' 'ThunderstorePackage/LethalAICrewmate.dll')
          if ($trackedBinaries.Count -gt 0) {
            throw "Generated release binaries must not be tracked: $($trackedBinaries -join ', ')"
          }

          $icon = [System.Drawing.Image]::FromFile((Resolve-Path 'ThunderstorePackage/icon.png'))
          try {
            if ($icon.Width -ne 256 -or $icon.Height -ne 256) {
              throw "Thunderstore icon must be 256x256; got $($icon.Width)x$($icon.Height)"
            }
          } finally {
            $icon.Dispose()
          }

          "MOD_VERSION=$manifestVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Scan source tree for embedded API keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '(gsk_|sk-(?:proj-)?)[A-Za-z0-9_-]{20,}'
          $extensions = @('.cs', '.md', '.json', '.yml', '.yaml', '.ps1', '.csproj', '.txt')
          $hits = @()
          Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch '[\\/]\.git[\\/]' -and
            $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
            $extensions -contains $_.Extension.ToLowerInvariant()
          } | ForEach-Object {
            $text = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            if ($text -match $pattern) { $hits += $_.FullName }
          }
          if ($hits.Count -gt 0) { throw "Possible API key embedded in source: $($hits -join ', ')" }

      - name: Restore
        run: dotnet restore src/LethalAICrewmate.csproj

      - name: Build release DLL
        run: dotnet build src/LethalAICrewmate.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run protocol and audio release checks
        run: dotnet run --project tests/ReleaseChecks/ReleaseChecks.csproj -c Release

      - name: Validate compiled DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'src/bin/Release/netstandard2.1/LethalAICrewmate.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled DLL: $dll" }
          if ((Get-Item $dll).Length -lt 1024) { throw 'Compiled DLL is unexpectedly small' }

          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll)).Version
          if ($assemblyVersion.Major -ne [int]($env:MOD_VERSION.Split('.')[0]) -or
              $assemblyVersion.Minor -ne [int]($env:MOD_VERSION.Split('.')[1]) -or
              $assemblyVersion.Build -ne [int]($env:MOD_VERSION.Split('.')[2])) {
            throw "DLL assembly version $assemblyVersion does not match $env:MOD_VERSION"
          }

          $bytes = [IO.File]::ReadAllBytes($dll)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          $secretPattern = '(gsk_|sk-(?:proj-)?)[A-Za-z0-9_-]{20,}'
          if ($ascii -match $secretPattern -or $utf16 -match $secretPattern) {
            throw 'Possible API key embedded in compiled DLL'
          }

      - name: Build and validate Thunderstore ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'src/bin/Release/netstandard2.1/LethalAICrewmate.dll'
          $staging = Join-Path $env:RUNNER_TEMP 'lethal-ai-package'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item $dll (Join-Path $staging 'LethalAICrewmate.dll')
          Copy-Item 'ThunderstorePackage/manifest.json' (Join-Path $staging 'manifest.json')
          Copy-Item 'ThunderstorePackage/README.md' (Join-Path $staging 'README.md')
          Copy-Item 'ThunderstorePackage/CHANGELOG.md' (Join-Path $staging 'CHANGELOG.md')
          Copy-Item 'ThunderstorePackage/icon.png' (Join-Path $staging 'icon.png')

          $expected = @('LethalAICrewmate.dll','manifest.json','README.md','CHANGELOG.md','icon.png') | Sort-Object
          $actual = Get-ChildItem $staging -File | Select-Object -ExpandProperty Name | Sort-Object
          if (($expected -join '|') -ne ($actual -join '|')) { throw "Unexpected package contents: $($actual -join ', ')" }

          $manifest = Get-Content (Join-Path $staging 'manifest.json') -Raw | ConvertFrom-Json
          if ([string]$manifest.version_number -ne $env:MOD_VERSION) { throw 'Staged manifest version changed unexpectedly' }

          $zip = "LethalAICrewmate-$env:MOD_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -gt 5MB) { throw "Release ZIP unexpectedly exceeds 5 MiB" }

          $verify = Join-Path $env:RUNNER_TEMP 'lethal-ai-package-verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive $zip -DestinationPath $verify
          $inside = Get-ChildItem $verify -File | Select-Object -ExpandProperty Name | Sort-Object
          if (($expected -join '|') -ne ($inside -join '|')) { throw "ZIP validation failed: $($inside -join ', ')" }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content 'SHA256SUMS.txt' -Encoding ascii
          "Built $zip ($((Get-Item $zip).Length) bytes) SHA256=$hash"

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: LethalAICrewmate-${{ env.MOD_VERSION }}
          path: |
            LethalAICrewmate-${{ env.MOD_VERSION }}.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:MOD_VERSION"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it untouched."
            exit 0
          }

          gh release create $tag `
            "LethalAICrewmate-$env:MOD_VERSION.zip" `
            'SHA256SUMS.txt' `
            --target $env:GITHUB_SHA `
            --title "LethalAICrewmate $tag" `
            --generate-notes
